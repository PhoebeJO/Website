<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Object Properties</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f4f4; }
    h2 { color: #333; }
    .box { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .prop { padding: 6px 0; border-bottom: 1px solid #eee; color: #555; }
    .prop span { font-weight: bold; color: #222; }
    pre { background: #272822; color: #f8f8f2; padding: 16px; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>JavaScript Object Demo</h2>

  <div class="box">
    <h3>All Properties of Person Object</h3>
    <div id="allProps"></div>
  </div>

  <div class="box">
    <h3>Object After Deleting <code>age</code></h3>
    <div id="afterDelete"></div>
  </div>

  <div class="box">
    <h3>Console Output (JSON)</h3>
    <pre id="jsonOutput"></pre>
  </div>

  <script>
    var Person = {
      firstName: "Tony",
      lastName: "Lee",
      age: 50,
      eyeColor: "Blue"
    };

    // List all properties
    const allPropsDiv = document.getElementById('allProps');
    for (let key in Person) {
      allPropsDiv.innerHTML += `<div class="prop"><span>${key}</span>: ${Person[key]}</div>`;
    }

    // Delete age property
    delete Person.age;

    // Show object after deletion
    const afterDeleteDiv = document.getElementById('afterDelete');
    for (let key in Person) {
      afterDeleteDiv.innerHTML += `<div class="prop"><span>${key}</span>: ${Person[key]}</div>`;
    }

    // Show JSON
    document.getElementById('jsonOutput').textContent = JSON.stringify(Person, null, 2);
  </script>
</body>
</html>
