<!DOCTYPE html>
<html>
<head>
<style>
table {
  border: 2px solid black;
  border-collapse:collapse;
  width: 30%;
}

th{
  border: 2px solid black;
  padding: 8px;
  text-align: left;
  background-color: gray;
  color:white;
}
td{
  border: 2px solid black;
  padding: 8px;
  text-align: left;
}

tr:nth-child(even){background-color: yellow;}

div.fixed {
  position: fixed;
  top: 0;
  right: 0;
  width: 100px;
  height: 100px;
  border: 3px solid #73AD21;
}
</style>
</head>
<body>

<div class="fixed">
This div
element has
position: fixed
</div>


<table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
  </tr>
  <tr>
    <td>1</td>
    <td>1</td>
  </tr>
  <tr>
    <td>2</td>
    <td>2</td>
  </tr>
  <tr>
    <td>3</td>
    <td>3</td>
  </tr>
</table>

</body>
</html>
