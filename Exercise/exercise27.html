<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Layout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: #5bb8f5;
    padding: 16px;
    min-height: 100vh;
  }
 
  .green  { background: #a8d55a; }
  .teal   { background: #5ec8c8; }
  .silver { background: #d0d8e0; }
 
  .box { border-radius: 4px; }
 
  .layout {
    display: grid;
    gap: 8px;
  }
 
  .box-green { min-height: 100px; }
 
  /* Wide ≥ 480px */
  .teal-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .teal-row .box { min-height: 100px; }
 
  .silver-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .silver-row .box { min-height: 70px; }
 
  /* Narrow < 480px */
  @media (max-width: 479px) {
    .teal-row {
      grid-template-columns: 1fr;
    }
    .teal-row .box { min-height: 50px; }
 
    .silver-row {
      grid-template-columns: repeat(2, 1fr);
    }
    .silver-row .box { min-height: 55px; }
  }
</style>
</head>
<body>
 
<div class="layout">
  <div class="box green box-green"></div>
 
  <div class="teal-row">
    <div class="box teal"></div>
    <div class="box teal"></div>
    <div class="box teal"></div>
  </div>
 
  <div class="silver-row">
    <div class="box silver"></div>
    <div class="box silver"></div>
    <div class="box silver"></div>
    <div class="box silver"></div>
  </div>
</div>
 
</body>
