<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Layout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: #5bb8f5;
    padding: 16px;
    min-height: 100vh;
  }
 
  .grid_3{
    display: grid;
    gap: 8px;
    background: #5bb8f5;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: auto auto auto;
  }
 
  .box {
    border-radius: 4px;
    min-height: 60px;
  }
 
  .green  { background: #a8d55a; }
  .teal   { background: #5ec8c8; }
  .silver { background: #d0d8e0; }
 
  /* ── (b) Wide layout: ≥ 480px — 4-column grid ── */
  .grid_4 {
    display: grid;
    gap: 8px;
    background: #5bb8f5;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: auto auto auto;
  }
 
  /* Row 1: green header spans all 4 cols */
  .box-green  { grid-column: 1 / -1; min-height: 100px; }
 
  /* Row 2: 3 equal teal boxes */
  .box-teal-1,
  .box-teal-2,
  .box-teal-3{ grid-column: span 1; min-height: 100px; }
 
  /* Row 3: 4 equal silver boxes */
  .box-silver-1,
  .box-silver-2,
  .box-silver-3,
  .box-silver-4 { grid-column: span 1; min-height: 70px; }
 
  /* ── (a) Narrow layout: < 480px — single column ── */
  @media (max-width: 479px) {
    .grid {
      grid-template-columns: 1fr;
    }
 
    .box-green { grid-column: 1; }
 
    /* Teal boxes stack as full-width rows */
    .box-teal-1,
    .box-teal-2,
    .box-teal-3{ grid-column: 1; min-height: 50px; }
 
    /* Silver boxes: 2-column mini grid — use subgrid workaround */
    .silver-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      grid-column: 1;
    }
  }
 
  /* Silver row wrapper only visible on wide */
  .silver-row {
    display: contents; /* transparent wrapper on wide */
  }
 
  @media (max-width: 479px) {
    .silver-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .silver-row .box {
      min-height: 55px;
    }
  }
</style>
</head>
<body>
<div class="grid_3">
  <div class="box green box-green"></div>
  <!-- Row 2: teal × 4 -->
  <div class="box teal box-teal-1"></div>
  <div class="box teal box-teal-2"></div>
  <div class="box teal box-teal-3"></div>

</div>
<div class="grid_4">

  <div class="silver-row">
    <div class="box silver box-silver-1"></div>
    <div class="box silver box-silver-2"></div>
    <div class="box silver box-silver-3"></div>
    <div class="box silver box-silver-4"></div>
  </div>
</div>
 
</body>
