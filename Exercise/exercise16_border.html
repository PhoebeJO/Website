<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
<style>
p.one {
  border-style: double;
  border-width: 5px;
  border-color: red;
  background-color:lightblue;
}

p.two {
  border-style: solid;
  border-radius: 5px;
  border-width: 2px; 
  border-color: blue;
  background-color: yellow;
}

p.thr {
  border-style: dotted;
  border-width: 5px; 
  border-color: pink;
  background-color: lightgreen;
}
</style>
</head>
<body>

<p class="one">Hello World</p>
<p class="two">Hello World</p>
<p class="thr">Hello World</p>

</body>
</html>
